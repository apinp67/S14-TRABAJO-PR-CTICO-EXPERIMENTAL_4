{% extends 'base.html' %}{% block contenido %}<div class="d-flex justify-content-between mb-4"><h1 class="text-capitalize">{{ modulo }}</h1><a class="btn btn-primary" href="{% url 'crear' modulo %}">Nuevo registro</a></div><div class="table-responsive"><table class="table table-striped align-middle"><thead><tr>{% for campo in campos %}<th class="text-capitalize">{{ campo.verbose_name }}</th>{% endfor %}<th>Acciones</th></tr></thead><tbody>{% for pk, valores in filas %}<tr>{% for valor in valores %}<td>{{ valor }}</td>{% endfor %}<td><a class="btn btn-sm btn-outline-primary" href="{% url 'editar' modulo pk %}">Editar</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'eliminar' modulo pk %}">Eliminar</a></td></tr>{% empty %}<tr><td colspan="99">No hay registros.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
